name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: python3 scripts/release.py metadata --github-output --ref "$GITHUB_REF"
      - run: |
          python3 tests/test_release.py
          python3 scripts/release.py notes --output release-notes.md
          python3 scripts/release.py source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/Stel-source-*.tar.gz
          if-no-files-found: error

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-linux-deps.sh
      - name: Build and test the native application
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTEL_QT_MAJOR=5 -DSTEL_DISTRO_LINPHONE=ON -DSTEL_AV1_ADDON=ON -DSTEL_LEGACY_VIDEO_ADDON=ON
          cmake --build build --parallel 4
          bash scripts/ci/test-linux.sh build
      - name: Package and test the standalone binary
        run: |
          python3 scripts/package-linux.py
          python3 scripts/ci/smoke-portable.py dist/Stel-linux-x86_64.run
          python3 scripts/ci/linux-sources.py dist/Stel-linux-x86_64 --output dist
          python3 scripts/ci/stage-assets.py linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-logs
          path: build/Testing/Temporary/*.log

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3 meson==1.5.2 pystache==0.6.7 six==1.17.0 pefile==2024.8.26
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
          setup-python: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel make perl gawk bzip2 nasm sed intltool patch
            mingw-w64-ucrt-x86_64-yasm mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-doxygen mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
      - name: Verify pinned Python and SDK build tools
        run: |
          python -c "import sys, pystache, six, mesonbuild, pefile; assert sys.version_info[:2] == (3, 11), sys.version"
          if ($LASTEXITCODE) { throw 'Python toolchain was changed by a dependency action' }
          cmake --version
          if ($LASTEXITCODE) { throw 'CMake is missing' }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: '14.29'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dependencies
        with:
          path: C:/stel-deps
          key: windows-v142-${{ hashFiles('packaging/dependencies.json', 'scripts/ci/windows-deps.ps1', 'scripts/ci/fetch-source-archives.py', 'scripts/ci/patch-sdk.py', 'packaging/patches/**') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dependencies.outputs.cache-hit != 'true'
        id: sources
        with:
          path: |
            C:/stel-deps/src
            C:/stel-deps/archives
          key: windows-sdk-sources-${{ hashFiles('packaging/dependencies.json') }}
      - name: Fetch and verify SDK sources
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: ./scripts/ci/windows-deps.ps1 -DownloadOnly
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dependencies.outputs.cache-hit != 'true' && steps.sources.outputs.cache-hit != 'true'
        with:
          path: |
            C:/stel-deps/src
            C:/stel-deps/archives
          key: windows-sdk-sources-${{ hashFiles('packaging/dependencies.json') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        env:
          STEL_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/ci/windows-deps.ps1
      - name: Cache the successfully compiled SDK
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: C:/stel-deps
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - run: ./scripts/ci/windows-build.ps1
      - run: |
          python scripts/ci/windows-sources.py
          if ($LASTEXITCODE) { throw 'Source collection failed' }
          python scripts/ci/stage-assets.py windows
          if ($LASTEXITCODE) { throw 'Asset staging failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-logs
          path: |
            build-windows/Testing/Temporary/*.log
            build-windows/Testing/Temporary/*-qt.txt

  release:
    needs: [metadata, linux, windows]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.metadata.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{linux,windows,source}'
          merge-multiple: true
          path: release-assets
      - run: python3 scripts/release.py notes --output release-notes.md
      - name: Publish only after every build and test succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish-release.py
